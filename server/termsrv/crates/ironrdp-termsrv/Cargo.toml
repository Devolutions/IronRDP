[package]
name = "ironrdp-termsrv"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[target.'cfg(windows)'.dependencies]
anyhow = "1"
async-trait = "0.1"
rustls-cng = "0.7" # CNG key handles implement rustls signing keys.
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = "0.26"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde_json = "1"
ironrdp-acceptor = { path = "../../../../crates/ironrdp-acceptor", version = "0.12" }
ironrdp-pdu = { path = "../../../../crates/ironrdp-pdu", version = "0.11.0" }
ironrdp-server = { path = "../../../../crates/ironrdp-server", version = "0.14" }
ironrdp-wtsprotocol-ipc = { path = "../ironrdp-wtsprotocol-ipc", version = "0.1" }
x509-cert = { version = "0.3", default-features = false, features = ["std"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Certificates", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Performance", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Pointer", "Win32_UI_WindowsAndMessaging"] }
ironrdp-cliprdr = { version = "0.9.0", path = "../../../../crates/ironrdp-cliprdr" }
ironrdp-cliprdr-native = { version = "0.9.0", path = "../../../../crates/ironrdp-cliprdr-native" }
ironrdp-core = { version = "0.3.0", path = "../../../../crates/ironrdp-core" }
ironrdp-displaycontrol = { version = "0.10.0", path = "../../../../crates/ironrdp-displaycontrol" }
ironrdp-dvc = { version = "0.10.0", path = "../../../../crates/ironrdp-dvc" }
ironrdp-svc = { version = "0.10.0", path = "../../../../crates/ironrdp-svc" }
ironrdp-rdpecam = { version = "0.2.0", path = "../../../../crates/ironrdp-rdpecam" }

[target.'cfg(windows)'.dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true
