[workspace]
dependencies_update = true
git_release_enable = false
semver_check = true
pr_branch_prefix = "release-plz/"
pr_name = "chore(release): prepare for publishing"
changelog_config = "cliff.toml"
release_commits = "^(feat|docs|fix|build|perf)"

# Executable crates for which we push a GitHub release (and attach prebuilt binaries via
# release-binaries.yml). Each is released under its own tag (ironrdp-agent-v*, ironrdp-viewer-v*).
[[package]]
name = "ironrdp-agent"
git_release_enable = true
release = false # depends on an excluded crate, see below
[[package]]
name = "ironrdp-viewer"
git_release_enable = true
release = false # depends on an excluded crate, see below

# ironrdp-tls does not compile if no backend is specified, and the following crates depend on it
# without enabling a backend by default. rustls is the most common backend, so we let cargo publish
# check with it.
[[package]]
name = "ironrdp-tls"
publish_features = ["rustls"]
[[package]]
name = "ironrdp-client"
publish_features = ["rustls"]
release = false # depends on unpublishable crates, see below
[[package]]
name = "ironrdp-mstsgu"
publish_features = ["rustls"]

# *-native crates may have all kinds of system requirements depending on the platform.
# We can only check for the current platform when cargo publish is invoked, all the others are effectively unverified.
# For this reason, it's not worth complexifying the release-crates.yml workflow.
# We already verify all targets properly in the regular CI workflow.
[[package]]
name = "ironrdp-rdpdr-native"
publish_no_verify = true
[[package]]
name = "ironrdp-rdpsnd-native"
publish_no_verify = true
[[package]]
name = "ironrdp-cliprdr-native"
publish_no_verify = true
[[package]]
name = "ironrdp-rdpewa-native"
publish_no_verify = true

# ironrdp-client cannot be published while it depends on ironrdp-rdpear (through ironrdp-connector) and ironrdp-rdpeusb-native,
# which have never been published; ironrdp depends on ironrdp-client and is excluded with it.
# ironrdp-daemon, ironrdp-rdpeusb-native, and ironrdp-rdpear have never been published: the daemon needs ironrdp-client,
# ironrdp-rdpeusb-native builds only against unreleased changes in ironrdp-rdpeusb and ironrdp-usb, and
# ironrdp-connector (plus its direct and transitive dependents) optionally depends on ironrdp-rdpear.
# Trusted publishing cannot create a crate, so release-plz would fail on each of them and stop before releasing the rest.
# Once its dependencies are on crates.io, publish each new crate manually once, then remove its entry;
# ironrdp-agent and ironrdp-viewer, excluded above, depend on ironrdp-daemon.
[[package]]
name = "ironrdp"
release = false
[[package]]
name = "ironrdp-daemon"
release = false
[[package]]
name = "ironrdp-rdpeusb-native"
release = false
[[package]]
name = "ironrdp-rdpear"
release = false
[[package]]
name = "ironrdp-connector"
release = false
[[package]]
name = "ironrdp-acceptor"
release = false
[[package]]
name = "ironrdp-async"
release = false
[[package]]
name = "ironrdp-blocking"
release = false
[[package]]
name = "ironrdp-futures"
release = false
[[package]]
name = "ironrdp-rdpeudp-tokio"
release = false
[[package]]
name = "ironrdp-server"
release = false
[[package]]
name = "ironrdp-tokio"
release = false
[[package]]
name = "ironrdp-vmconnect"
release = false
