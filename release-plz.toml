[workspace]
dependencies_update = true
git_release_enable = false
semver_check = true
pr_branch_prefix = "release-plz/"
pr_name = "chore(release): prepare for publishing"
changelog_config = "cliff.toml"
release_commits = "^(feat|docs|fix|build|perf)"

# Executable crates for which we push a GitHub release (and attach prebuilt binaries via
# release-binaries.yml). Each is released under its own tag (ironrdp-agent-v*, ironrdp-viewer-v*).
[[package]]
name = "ironrdp-agent"
git_release_enable = true
release = false # depends on an excluded crate, see below
[[package]]
name = "ironrdp-viewer"
git_release_enable = true
release = false # depends on an excluded crate, see below

# ironrdp-tls does not compile if no backend is specified, and the following crates depend on it
# without enabling a backend by default. rustls is the most common backend, so we let cargo publish
# check with it.
[[package]]
name = "ironrdp-tls"
publish_features = ["rustls"]
[[package]]
name = "ironrdp-client"
publish_features = ["rustls"]
release = false # depends on an excluded crate, see below
[[package]]
name = "ironrdp-mstsgu"
publish_features = ["rustls"]

# *-native crates may have all kinds of system requirements depending on the platform.
# We can only check for the current platform when cargo publish is invoked, all the others are effectively unverified.
# For this reason, it's not worth complexifying the release-crates.yml workflow.
# We already verify all targets properly in the regular CI workflow.
[[package]]
name = "ironrdp-rdpdr-native"
publish_no_verify = true
[[package]]
name = "ironrdp-rdpsnd-native"
publish_no_verify = true
release = false # depends on an excluded crate, see below
[[package]]
name = "ironrdp-cliprdr-native"
publish_no_verify = true

# These crates have never been published, and they build only against unreleased changes in the crates they depend on.
# Trusted publishing cannot create a crate, so release-plz would fail on each of them and stop before releasing the rest.
# Once their dependencies are released, publish each crate manually once, then remove its entry.
# Crates that depend on them, directly or transitively and including optional dependencies, cannot be published either and are excluded too;
# ironrdp-agent, ironrdp-viewer, ironrdp-client and ironrdp-rdpsnd-native are excluded in their entries above.
[[package]]
name = "ironrdp"
release = false
[[package]]
name = "ironrdp-server"
release = false
[[package]]
name = "ironrdp-rdpeudp"
release = false
[[package]]
name = "ironrdp-rdpemt"
release = false
[[package]]
name = "ironrdp-rdpeudp-tokio"
release = false
[[package]]
name = "ironrdp-rdpeai"
release = false
[[package]]
name = "ironrdp-rdpewa"
release = false
[[package]]
name = "ironrdp-rdpewa-native"
release = false
[[package]]
name = "ironrdp-rdpeusb"
release = false
[[package]]
name = "ironrdp-rpc"
release = false
[[package]]
name = "ironrdp-vmconnect"
release = false
[[package]]
name = "ironrdp-daemon"
release = false
