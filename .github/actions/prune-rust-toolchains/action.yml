name: Prune Rust toolchains
description: >-
  Keep only the toolchain pinned in rust-toolchain.toml. Swatinem/rust-cache hashes every installed
  toolchain into its key, so the runner's preinstalled stable (which differs across image rollouts)
  would otherwise split the cache and cause full rebuilds. Run this before the Rust cache step.

runs:
  using: composite
  steps:
    - name: Uninstall unpinned Rust toolchains
      shell: bash
      run: |
        rustup toolchain install
        pinned="$(rustup show active-toolchain | cut -d' ' -f1)"
        rustup default "$pinned"
        rustup toolchain list --quiet | tr -d '\r' | grep -vxF "$pinned" | xargs -r -n1 rustup toolchain uninstall
        rustup toolchain list
