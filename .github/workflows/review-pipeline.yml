name: Automated review pipeline

on:
  workflow_call:
    inputs:
      pr-number:
        description: Pull request number to review
        required: true
        type: string
      head-sha:
        description: Exact pull request head to review
        required: true
        type: string
      base-sha:
        description: Exact pull request base used for the review diff
        required: true
        type: string
      specialist-reviewers:
        description: Canonically ordered specialist reviewer IDs
        required: true
        type: string
      evidence-max-bytes:
        description: Trusted maximum evidence diff size
        required: true
        type: string
      required-reviewers:
        description: Specialist reviewer IDs the caller requires to succeed
        required: false
        type: string
        default: ""
      gate:
        description: Validated review gate state, used only when required-reviewers is absent
        required: false
        type: string
        default: ""
      retry-delay-seconds:
        description: Delay before the single retry of a transiently failed reviewer stage
        required: false
        type: string
        default: "120"
    outputs:
      output:
        description: Validated final review JSON
        value: ${{ jobs.validate.outputs.output }}
      failure-reason:
        description: Bounded failure reason when no valid review was produced
        value: ${{ jobs.validate.outputs.reason }}
      report:
        description: Canonical per-stage outcome and metric report
        value: ${{ jobs.report.outputs.report }}

permissions: {}

jobs:
  evidence:
    name: Prepare review evidence
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
    outputs:
      failure-reason: ${{ steps.record.outputs.failure-reason }}
      stage: ${{ steps.record.outputs.stage }}
      openspecs-sha: ${{ steps.protocol-sources.outputs.openspecs-sha }}
    steps:
      - id: evidence
        name: Prepare SHA-bound pull request evidence
        shell: bash
        env:
          HEAD_SHA: ${{ inputs.head-sha }}
          BASE_SHA: ${{ inputs.base-sha }}
          EVIDENCE_MAX_BYTES: ${{ inputs.evidence-max-bytes }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          echo "EVIDENCE_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_GLOBAL=/dev/null
          git init .
          git config --local core.hooksPath /dev/null
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags origin "+$WORKFLOW_SHA:refs/remotes/origin/automation"
          git checkout --detach origin/automation
          if ! bash ./.github/pr-automation/fetch-pr-evidence.sh \
            "$HEAD_SHA" "$BASE_SHA" "$EVIDENCE_MAX_BYTES"; then
            reason="pull request evidence unavailable"
            if test -f pr-evidence/failure-reason.txt; then
              reason="$(cat pr-evidence/failure-reason.txt)"
            fi
            echo "failure-reason=$reason" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Fetch bounded review and location context
        uses: actions/github-script@v8
        env:
          HEAD_SHA: ${{ inputs.head-sha }}
          PULL_REQUEST_NUMBER: ${{ inputs.pr-number }}
        with:
          script: |
            const fs = require("node:fs");
            const { addedLinesByPath, listPrFiles } = require("./.github/pr-automation/deterministic-analysis");
            const { fetchReviewContext } = require("./.github/pr-automation/fetch-review-context");
            const { assertCurrentHead } = require("./.github/pr-automation/review-retry");
            const pullNumber = Number(process.env.PULL_REQUEST_NUMBER);
            const expectedSha = process.env.HEAD_SHA;
            const assertHead = () => assertCurrentHead({
              github, owner: context.repo.owner, repo: context.repo.repo,
              pullNumber, expectedHeadSha: expectedSha,
            });
            await assertHead();
            const reviewContext = await fetchReviewContext({
              github, owner: context.repo.owner, repo: context.repo.repo,
              pullNumber, expectedHeadSha: expectedSha,
            });
            const files = await listPrFiles(github, {
              owner: context.repo.owner, repo: context.repo.repo, prNumber: pullNumber,
            });
            await assertHead();
            fs.writeFileSync(
              "pr-evidence/pull-request-context.json",
              JSON.stringify(reviewContext, null, 2),
            );
            fs.writeFileSync(
              "pr-evidence/validation-context.json",
              JSON.stringify({
                changed_paths: files.map((file) => file.filename),
                changed_lines: addedLinesByPath(files),
              }),
            );
            fs.writeFileSync(
              "pr-automation-context.json",
              JSON.stringify({ head_sha: expectedSha }),
            );

      - name: Fetch and sanitize the latest protocol corpus
        id: protocol-sources
        if: contains(fromJSON(inputs.specialist-reviewers), 'protocol')
        shell: bash
        run: |
          set -euo pipefail
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_GLOBAL=/dev/null
          git -C "$RUNNER_TEMP" init openspecs
          git -C "$RUNNER_TEMP/openspecs" config --local core.hooksPath /dev/null
          git -C "$RUNNER_TEMP/openspecs" remote add origin https://github.com/awakecoding/openspecs.git
          git -C "$RUNNER_TEMP/openspecs" fetch --depth=1 --no-tags origin +master:refs/remotes/origin/master
          git -C "$RUNNER_TEMP/openspecs" checkout --detach origin/master
          openspecs_sha="$(git -C "$RUNNER_TEMP/openspecs" rev-parse HEAD)"
          bash ./.github/pr-automation/prepare-review-sources.sh \
            "$RUNNER_TEMP/openspecs" "$openspecs_sha"
          echo "openspecs-sha=$openspecs_sha" >> "$GITHUB_OUTPUT"
          echo "Protocol corpus: \`awakecoding/openspecs@$openspecs_sha\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove Git metadata from the untrusted head
        shell: bash
        run: rm -rf pr-head/.git

      # Evidence is prepared once. Every stage, including a delayed retry, reads these exact bytes.
      - name: Upload review evidence
        uses: actions/upload-artifact@v7
        with:
          name: review-evidence-${{ inputs.head-sha }}
          path: |
            pr-automation-context.json
            pr-evidence
            pr-head
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
          overwrite: true

      - name: Upload validation context
        uses: actions/upload-artifact@v7
        with:
          name: review-validation-${{ inputs.head-sha }}
          path: pr-evidence/validation-context.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Upload protocol corpus
        if: contains(fromJSON(inputs.specialist-reviewers), 'protocol')
        uses: actions/upload-artifact@v7
        with:
          name: review-corpus-${{ inputs.head-sha }}
          path: review-sources
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
          overwrite: true

      # One record, so a failure in any evidence step reaches the report, not just the diff fetch.
      - id: record
        name: Record the evidence stage outcome
        if: always()
        uses: actions/github-script@v8
        env:
          EVIDENCE_STATUS: ${{ job.status }}
          EVIDENCE_REASON: ${{ steps.evidence.outputs.failure-reason }}
        with:
          script: |
            const { stageOutcome } = require("./.github/pr-automation/review-report");
            const ok = process.env.EVIDENCE_STATUS === "success";
            const started = Number(process.env.EVIDENCE_STARTED_MS);
            const reason = ok
              ? ""
              : process.env.EVIDENCE_REASON || "pull request evidence unavailable";
            core.setOutput("failure-reason", reason);
            core.setOutput("stage", JSON.stringify(stageOutcome({
              id: "evidence",
              status: ok ? "success" : "failed",
              required: true,
              reason,
              category: ok ? "" : "evidence-unavailable",
              metrics: {
                elapsed_ms: Number.isFinite(started) ? Date.now() - started : null,
              },
            })));

  specialists:
    name: Review with ${{ matrix.reviewer }}
    needs: evidence
    if: needs.evidence.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Read-only, and used for one thing: confirming the head still matches before a delayed retry
      # spends a second provider request.
      pull-requests: read
    environment: llm-providers
    strategy:
      fail-fast: false
      # Provider allocation, not a reviewer cap: more selected IDs simply run in further batches.
      max-parallel: 3
      matrix:
        reviewer: ${{ fromJSON(inputs.specialist-reviewers) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Download review evidence
        uses: actions/download-artifact@v8
        with:
          name: review-evidence-${{ inputs.head-sha }}
          path: .

      - name: Download protocol corpus
        if: matrix.reviewer == 'protocol'
        uses: actions/download-artifact@v8
        with:
          name: review-corpus-${{ inputs.head-sha }}
          path: review-sources

      - id: plan
        name: Build the validator metadata
        uses: actions/github-script@v8
        env:
          REVIEWER: ${{ matrix.reviewer }}
          HEAD_SHA: ${{ inputs.head-sha }}
          CORPUS_SHA: ${{ needs.evidence.outputs.openspecs-sha }}
        with:
          script: |
            const reviewer = process.env.REVIEWER;
            const corpusSha = reviewer === "protocol" ? process.env.CORPUS_SHA : "";
            core.setOutput("metadata", JSON.stringify({
              stage: "specialist",
              reviewer,
              expected_sha: process.env.HEAD_SHA,
              validation_context_file: "pr-evidence/validation-context.json",
              ...(corpusSha
                ? { corpus_dir: "review-sources/windows-protocols", corpus_sha: corpusSha }
                : {}),
            }));

      - id: agent
        name: Run ${{ matrix.reviewer }} specialist
        continue-on-error: true
        uses: ./.github/actions/openai-agent
        with:
          api-key: ${{ secrets.HELMCODE_GLM_API_KEY }}
          base-url: https://api.helmcode.com/v1
          config-file: .github/pr-automation/agents/${{ matrix.reviewer }}.json
          validator: .github/pr-automation/agent-validator.js#validateSpecialist
          validator-metadata: ${{ steps.plan.outputs.metadata }}

      - id: retry-gate
        name: Decide on a delayed retry
        if: steps.agent.outputs.retryable == 'true'
        uses: actions/github-script@v8
        env:
          HEAD_SHA: ${{ inputs.head-sha }}
          PULL_REQUEST_NUMBER: ${{ inputs.pr-number }}
          FAILURE_CATEGORY: ${{ steps.agent.outputs.failure-category }}
          RETRY_DELAY_SECONDS: ${{ inputs.retry-delay-seconds }}
        with:
          script: |
            const { delayedRetryGate } = require("./.github/pr-automation/review-retry");
            const decision = await delayedRetryGate({
              github, owner: context.repo.owner, repo: context.repo.repo,
              pullNumber: Number(process.env.PULL_REQUEST_NUMBER),
              expectedHeadSha: process.env.HEAD_SHA,
              failureCategory: process.env.FAILURE_CATEGORY,
              delaySeconds: Number(process.env.RETRY_DELAY_SECONDS),
            });
            core.setOutput("retry", String(decision.retry));
            core.setOutput("reason", decision.reason);
            core.info(JSON.stringify({
              event: "pr-automation.retry-gate", stage: "specialist", ...decision,
            }));

      - id: agent-retry
        name: Retry ${{ matrix.reviewer }} specialist
        if: steps.retry-gate.outputs.retry == 'true'
        continue-on-error: true
        uses: ./.github/actions/openai-agent
        with:
          api-key: ${{ secrets.HELMCODE_GLM_API_KEY }}
          base-url: https://api.helmcode.com/v1
          config-file: .github/pr-automation/agents/${{ matrix.reviewer }}.json
          validator: .github/pr-automation/agent-validator.js#validateSpecialist
          validator-metadata: ${{ steps.plan.outputs.metadata }}

      - id: validate
        name: Validate specialist result
        if: always() && steps.plan.outcome == 'success'
        uses: actions/github-script@v8
        env:
          HEAD_SHA: ${{ inputs.head-sha }}
          REVIEWER: ${{ matrix.reviewer }}
          OPENSPECS_SHA: ${{ needs.evidence.outputs.openspecs-sha }}
          REQUIRED_REVIEWERS: ${{ inputs.required-reviewers }}
          RAW_OUTPUT: ${{ steps.agent-retry.outputs.structured-output || steps.agent.outputs.structured-output }}
          MODEL_REASON: ${{ steps.agent-retry.outputs.failure-reason || steps.agent.outputs.failure-reason }}
          FAILURE_CATEGORY: ${{ steps.agent-retry.outputs.failure-category || steps.agent.outputs.failure-category }}
          DIAGNOSTICS: ${{ steps.agent.outputs.diagnostics }}
          RETRY_DIAGNOSTICS: ${{ steps.agent-retry.outputs.diagnostics }}
          RETRIED: ${{ steps.retry-gate.outputs.retry }}
          PREVIOUS_REASON: ${{ steps.agent.outputs.failure-reason }}
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const {
              mergeDiagnostics, parseDiagnostics, validateSpecialistRun,
            } = require("./.github/pr-automation/review-pipeline");
            const { stageOutcome } = require("./.github/pr-automation/review-report");
            const {
              corpusFromDirectory,
            } = require("./.github/pr-automation/validate-protocol-review");
            const reviewer = process.env.REVIEWER;
            const retried = process.env.RETRIED === "true";
            const failed = (reason) => ({ reviewer, status: "failed", reason });
            let run = failed("specialist validation unavailable");
            try {
              const validation = JSON.parse(fs.readFileSync(
                "pr-evidence/validation-context.json", "utf8",
              ));
              const corpus = reviewer === "protocol"
                ? corpusFromDirectory("review-sources/windows-protocols", {
                  expectedCorpusSha: process.env.OPENSPECS_SHA,
                })
                : undefined;
              const result = validateSpecialistRun(process.env.RAW_OUTPUT || "", {
                reviewer,
                expectedSha: process.env.HEAD_SHA,
                changedPaths: validation.changed_paths,
                changedLines: validation.changed_lines,
                corpus,
                expectedCorpusSha: process.env.OPENSPECS_SHA,
                failureReason: process.env.MODEL_REASON,
              });
              run = result.value ?? failed(result.reason || "specialist validation unavailable");
            } catch (error) {
              core.warning(`Specialist validation unavailable: ${error.message}`);
            }
            fs.mkdirSync("specialist-results", { recursive: true });
            fs.writeFileSync(
              path.join("specialist-results", `${reviewer}.json`),
              JSON.stringify(run, null, 2),
            );
            const required = (() => {
              try {
                return JSON.parse(process.env.REQUIRED_REVIEWERS || "[]");
              } catch {
                return [];
              }
            })();
            fs.mkdirSync("stage-reports", { recursive: true });
            fs.writeFileSync(
              path.join("stage-reports", `specialist-${reviewer}.json`),
              JSON.stringify(stageOutcome({
                id: `specialist:${reviewer}`,
                status: run.status === "valid" ? "success" : "failed",
                required: Array.isArray(required) && required.includes(reviewer),
                reason: run.status === "valid" ? "" : run.reason,
                category: run.status === "valid" ? "" : process.env.FAILURE_CATEGORY || "invalid-output",
                attempts: retried ? 2 : 1,
                previousReason: retried ? process.env.PREVIOUS_REASON : "",
                provider: true,
                metrics: mergeDiagnostics(
                  parseDiagnostics(process.env.DIAGNOSTICS),
                  retried ? parseDiagnostics(process.env.RETRY_DIAGNOSTICS) : null,
                ),
              }), null, 2),
            );
            core.info(JSON.stringify({
              event: "pr-automation.specialist",
              reviewer,
              status: run.status,
              attempts: retried ? 2 : 1,
            }));

      - name: Upload validated specialist result
        if: always() && steps.validate.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: review-specialist-${{ inputs.head-sha }}-${{ matrix.reviewer }}
          path: specialist-results/${{ matrix.reviewer }}.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      # Matrix legs cannot share job outputs, so only this stage report travels as an artifact.
      - name: Upload the specialist stage report
        if: always() && steps.validate.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: review-stage-${{ inputs.head-sha }}-${{ matrix.reviewer }}
          path: stage-reports/specialist-${{ matrix.reviewer }}.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  aggregate:
    name: Aggregate specialist findings
    needs: [evidence, specialists]
    if: always() && !cancelled() && needs.evidence.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.aggregate.outputs.ready }}
      reason: ${{ steps.aggregate.outputs.reason }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Download specialist results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: review-specialist-${{ inputs.head-sha }}-*
          path: specialist-results
          merge-multiple: true

      - id: aggregate
        name: Build validated specialist findings
        uses: actions/github-script@v8
        env:
          HEAD_SHA: ${{ inputs.head-sha }}
          SPECIALIST_REVIEWERS: ${{ inputs.specialist-reviewers }}
          REQUIRED_REVIEWERS: ${{ inputs.required-reviewers }}
          GATE: ${{ inputs.gate }}
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const {
              buildSpecialistAggregate, failedRun,
            } = require("./.github/pr-automation/review-pipeline");
            const selected = JSON.parse(process.env.SPECIALIST_REVIEWERS);
            const gate = process.env.GATE ? JSON.parse(process.env.GATE) : {};
            const requiredReviewers = process.env.REQUIRED_REVIEWERS
              ? JSON.parse(process.env.REQUIRED_REVIEWERS)
              : [];
            const runs = selected.map((reviewer) => {
              try {
                return JSON.parse(fs.readFileSync(
                  path.join("specialist-results", `${reviewer}.json`), "utf8",
                ));
              } catch (error) {
                core.warning(`Specialist result unavailable for ${reviewer}: ${error.message}`);
                return failedRun(reviewer, "specialist result unavailable").value;
              }
            });
            const result = buildSpecialistAggregate({
              expectedSha: process.env.HEAD_SHA,
              selectedReviewers: selected,
              runs,
              requiredReviewers,
              protocolRelated: gate.protocolRelated,
              risk: gate.risk,
            });
            if (!result.ok) throw new Error(result.reason);
            fs.writeFileSync(
              "validated-specialist-findings.json",
              JSON.stringify(result.value, null, 2),
            );
            core.setOutput("ready", result.mandatoryFailure === "");
            core.setOutput("reason", result.mandatoryFailure);
            core.info(JSON.stringify({
              event: "pr-automation.specialists",
              reviewers: result.value.reviewers.map(({ reviewer, status }) => ({ reviewer, status })),
              mandatoryFailure: result.mandatoryFailure !== "",
            }));

      - name: Upload specialist aggregate
        uses: actions/upload-artifact@v7
        with:
          name: review-aggregate-${{ inputs.head-sha }}
          path: validated-specialist-findings.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  general:
    name: Run independent general reviewer
    needs: [evidence, aggregate]
    if: needs.aggregate.result == 'success' && needs.aggregate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    environment: llm-providers
    outputs:
      stage: ${{ steps.persist.outputs.stage }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Download review evidence
        uses: actions/download-artifact@v8
        with:
          name: review-evidence-${{ inputs.head-sha }}
          path: .

      - name: Download specialist aggregate
        uses: actions/download-artifact@v8
        with:
          name: review-aggregate-${{ inputs.head-sha }}
          path: .

      - id: plan
        name: Build the validator metadata
        uses: actions/github-script@v8
        env:
          HEAD_SHA: ${{ inputs.head-sha }}
        with:
          script: |
            core.setOutput("metadata", JSON.stringify({
              stage: "general",
              expected_sha: process.env.HEAD_SHA,
              validation_context_file: "pr-evidence/validation-context.json",
              aggregate_file: "validated-specialist-findings.json",
            }));

      - id: agent
        name: Run general reviewer
        continue-on-error: true
        uses: ./.github/actions/openai-agent
        with:
          api-key: ${{ secrets.HELMCODE_GLM_API_KEY }}
          base-url: https://api.helmcode.com/v1
          config-file: .github/pr-automation/agents/general-reviewer.json
          validator: .github/pr-automation/agent-validator.js#validateGeneral
          validator-metadata: ${{ steps.plan.outputs.metadata }}

      - id: retry-gate
        name: Decide on a delayed retry
        if: steps.agent.outputs.retryable == 'true'
        uses: actions/github-script@v8
        env:
          HEAD_SHA: ${{ inputs.head-sha }}
          PULL_REQUEST_NUMBER: ${{ inputs.pr-number }}
          FAILURE_CATEGORY: ${{ steps.agent.outputs.failure-category }}
          RETRY_DELAY_SECONDS: ${{ inputs.retry-delay-seconds }}
        with:
          script: |
            const { delayedRetryGate } = require("./.github/pr-automation/review-retry");
            const decision = await delayedRetryGate({
              github, owner: context.repo.owner, repo: context.repo.repo,
              pullNumber: Number(process.env.PULL_REQUEST_NUMBER),
              expectedHeadSha: process.env.HEAD_SHA,
              failureCategory: process.env.FAILURE_CATEGORY,
              delaySeconds: Number(process.env.RETRY_DELAY_SECONDS),
            });
            core.setOutput("retry", String(decision.retry));
            core.setOutput("reason", decision.reason);
            core.info(JSON.stringify({
              event: "pr-automation.retry-gate", stage: "general", ...decision,
            }));

      - id: agent-retry
        name: Retry general reviewer
        if: steps.retry-gate.outputs.retry == 'true'
        continue-on-error: true
        uses: ./.github/actions/openai-agent
        with:
          api-key: ${{ secrets.HELMCODE_GLM_API_KEY }}
          base-url: https://api.helmcode.com/v1
          config-file: .github/pr-automation/agents/general-reviewer.json
          validator: .github/pr-automation/agent-validator.js#validateGeneral
          validator-metadata: ${{ steps.plan.outputs.metadata }}

      - id: persist
        name: Persist general review result
        if: always()
        uses: actions/github-script@v8
        env:
          RAW_OUTPUT: ${{ steps.agent-retry.outputs.structured-output || steps.agent.outputs.structured-output }}
          MODEL_REASON: ${{ steps.agent-retry.outputs.failure-reason || steps.agent.outputs.failure-reason }}
          FAILURE_CATEGORY: ${{ steps.agent-retry.outputs.failure-category || steps.agent.outputs.failure-category }}
          DIAGNOSTICS: ${{ steps.agent.outputs.diagnostics }}
          RETRY_DIAGNOSTICS: ${{ steps.agent-retry.outputs.diagnostics }}
          RETRIED: ${{ steps.retry-gate.outputs.retry }}
          PREVIOUS_REASON: ${{ steps.agent.outputs.failure-reason }}
        with:
          script: |
            const fs = require("node:fs");
            const {
              mergeDiagnostics, parseDiagnostics,
            } = require("./.github/pr-automation/review-pipeline");
            const { stageOutcome } = require("./.github/pr-automation/review-report");
            const retried = process.env.RETRIED === "true";
            const output = process.env.RAW_OUTPUT || "";
            const reason = output === ""
              ? process.env.MODEL_REASON || "general reviewer unavailable"
              : "";
            fs.mkdirSync("general-review", { recursive: true });
            fs.writeFileSync(
              "general-review/result.json",
              JSON.stringify({ output, reason }),
            );
            core.setOutput("stage", JSON.stringify(stageOutcome({
              id: "general",
              status: output === "" ? "failed" : "success",
              required: true,
              reason,
              category: output === ""
                ? process.env.FAILURE_CATEGORY || "invalid-output"
                : "",
              attempts: retried ? 2 : 1,
              previousReason: retried ? process.env.PREVIOUS_REASON : "",
              provider: true,
              metrics: mergeDiagnostics(
                parseDiagnostics(process.env.DIAGNOSTICS),
                retried ? parseDiagnostics(process.env.RETRY_DIAGNOSTICS) : null,
              ),
            })));

      - name: Upload general review result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: review-general-${{ inputs.head-sha }}
          path: general-review/result.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  validate:
    name: Validate final review
    needs: [evidence, aggregate, general]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      output: ${{ steps.final.outputs.output }}
      reason: ${{ steps.final.outputs.reason }}
      stage: ${{ steps.final.outputs.stage }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Download validation context
        if: needs.general.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: review-validation-${{ inputs.head-sha }}
          path: pr-evidence

      - name: Download specialist aggregate
        if: needs.general.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: review-aggregate-${{ inputs.head-sha }}
          path: .

      - name: Download general review result
        if: needs.general.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: review-general-${{ inputs.head-sha }}
          path: general-review

      - id: final
        name: Validate general review
        uses: actions/github-script@v8
        env:
          HEAD_SHA: ${{ inputs.head-sha }}
          EVIDENCE_RESULT: ${{ needs.evidence.result }}
          EVIDENCE_REASON: ${{ needs.evidence.outputs.failure-reason }}
          AGGREGATE_RESULT: ${{ needs.aggregate.result }}
          AGGREGATE_READY: ${{ needs.aggregate.outputs.ready }}
          AGGREGATE_REASON: ${{ needs.aggregate.outputs.reason }}
          GENERAL_RESULT: ${{ needs.general.result }}
        with:
          script: |
            const fs = require("node:fs");
            const { validateFinalReview } = require("./.github/pr-automation/validate-final-review");
            const { stageOutcome } = require("./.github/pr-automation/review-report");
            const finish = (output, reason, category) => {
              core.setOutput("output", output);
              core.setOutput("reason", reason);
              core.setOutput("stage", JSON.stringify(stageOutcome({
                id: "validate",
                status: output === "" ? "failed" : "success",
                required: true,
                reason: output === "" ? reason : "",
                category: output === "" ? category : "",
              })));
              core.info(JSON.stringify({
                event: "pr-automation.final-review",
                valid: output !== "",
                reason: output === "" ? reason : null,
              }));
            };
            if (process.env.EVIDENCE_RESULT !== "success") {
              return finish(
                "",
                process.env.EVIDENCE_REASON || "pull request evidence unavailable",
                "evidence-unavailable",
              );
            }
            if (process.env.AGGREGATE_RESULT !== "success") {
              return finish("", "specialist validation unavailable", "aggregate-invalid");
            }
            if (process.env.AGGREGATE_READY !== "true") {
              return finish(
                "",
                process.env.AGGREGATE_REASON || "a required specialist review failed",
                "required-specialist-failed",
              );
            }
            if (process.env.GENERAL_RESULT !== "success") {
              return finish("", "general review unavailable", "general-unavailable");
            }
            let persisted;
            let validation;
            let aggregate;
            try {
              persisted = JSON.parse(fs.readFileSync("general-review/result.json", "utf8"));
              validation = JSON.parse(fs.readFileSync(
                "pr-evidence/validation-context.json", "utf8",
              ));
              aggregate = JSON.parse(fs.readFileSync(
                "validated-specialist-findings.json", "utf8",
              ));
            } catch (error) {
              core.warning(`Final review inputs unavailable: ${error.message}`);
              return finish("", "general review unavailable", "general-unavailable");
            }
            if (!persisted.output) {
              return finish(
                "",
                persisted.reason || "general review unavailable",
                "general-unavailable",
              );
            }
            const result = validateFinalReview(persisted.output, {
              expectedSha: process.env.HEAD_SHA,
              changedPaths: validation.changed_paths,
              changedLines: validation.changed_lines,
              specialistAggregate: aggregate,
            });
            if (!result.ok) return finish("", result.reason, "invalid-final-review");
            return finish(JSON.stringify(result.value), "", "");

  report:
    name: Report stage outcomes
    needs: [evidence, specialists, aggregate, general, validate]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      report: ${{ steps.report.outputs.report }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Download specialist stage reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: review-stage-${{ inputs.head-sha }}-*
          path: stage-reports
          merge-multiple: true

      - id: report
        name: Build the canonical report
        uses: actions/github-script@v8
        env:
          SPECIALIST_REVIEWERS: ${{ inputs.specialist-reviewers }}
          REQUIRED_REVIEWERS: ${{ inputs.required-reviewers }}
          EVIDENCE_RESULT: ${{ needs.evidence.result }}
          EVIDENCE_REASON: ${{ needs.evidence.outputs.failure-reason }}
          EVIDENCE_STAGE: ${{ needs.evidence.outputs.stage }}
          SPECIALISTS_RESULT: ${{ needs.specialists.result }}
          AGGREGATE_RESULT: ${{ needs.aggregate.result }}
          AGGREGATE_READY: ${{ needs.aggregate.outputs.ready }}
          AGGREGATE_REASON: ${{ needs.aggregate.outputs.reason }}
          GENERAL_RESULT: ${{ needs.general.result }}
          GENERAL_STAGE: ${{ needs.general.outputs.stage }}
          VALIDATE_STAGE: ${{ needs.validate.outputs.stage }}
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const { buildReport, stageOutcome } = require("./.github/pr-automation/review-report");
            const json = (raw) => {
              try {
                return raw ? JSON.parse(raw) : null;
              } catch {
                return null;
              }
            };
            const selected = json(process.env.SPECIALIST_REVIEWERS) ?? [];
            const required = json(process.env.REQUIRED_REVIEWERS) ?? [];
            const isRequired = (reviewer) =>
              Array.isArray(required) && required.includes(reviewer);
            const evidenceOk = process.env.EVIDENCE_RESULT === "success";
            const evidenceStage = json(process.env.EVIDENCE_STAGE);
            const stages = [evidenceStage ? stageOutcome(evidenceStage) : stageOutcome({
              id: "evidence",
              status: evidenceOk ? "success" : "failed",
              required: true,
              reason: evidenceOk
                ? ""
                : process.env.EVIDENCE_REASON || "pull request evidence unavailable",
              category: evidenceOk ? "" : "evidence-unavailable",
            })];
            for (const reviewer of selected) {
              const file = path.join("stage-reports", `specialist-${reviewer}.json`);
              const recorded = (() => {
                try {
                  return JSON.parse(fs.readFileSync(file, "utf8"));
                } catch {
                  return null;
                }
              })();
              // A specialist that never reported is only a failure when the stage actually ran.
              stages.push(recorded ? stageOutcome({ ...recorded, provider: true }) : stageOutcome({
                id: `specialist:${reviewer}`,
                status: evidenceOk ? "failed" : "skipped",
                required: isRequired(reviewer),
                reason: evidenceOk ? "specialist result unavailable" : "",
                category: evidenceOk ? "specialist-unavailable" : "",
                provider: true,
              }));
            }
            const aggregateOk = process.env.AGGREGATE_RESULT === "success";
            const aggregateReady = process.env.AGGREGATE_READY === "true";
            stages.push(stageOutcome({
              id: "aggregate",
              status: !evidenceOk
                ? "skipped"
                : aggregateOk && aggregateReady ? "success" : "failed",
              required: true,
              reason: !evidenceOk || (aggregateOk && aggregateReady)
                ? ""
                : process.env.AGGREGATE_REASON || "specialist validation unavailable",
              category: !evidenceOk || (aggregateOk && aggregateReady)
                ? ""
                : aggregateOk ? "required-specialist-failed" : "aggregate-invalid",
            }));
            const generalStage = json(process.env.GENERAL_STAGE);
            stages.push(generalStage ? stageOutcome({ ...generalStage, provider: true }) : stageOutcome({
              id: "general",
              // The general reviewer is skipped by a failed dependency, which is not its failure.
              status: process.env.GENERAL_RESULT === "skipped" ? "skipped" : "failed",
              required: true,
              reason: process.env.GENERAL_RESULT === "skipped"
                ? ""
                : "general review unavailable",
              category: process.env.GENERAL_RESULT === "skipped"
                ? ""
                : "general-unavailable",
              provider: true,
            }));
            const validateStage = json(process.env.VALIDATE_STAGE);
            stages.push(validateStage ? stageOutcome(validateStage) : stageOutcome({
              id: "validate",
              status: "failed",
              required: true,
              reason: "final review validation did not run",
              category: "validation-unavailable",
            }));
            const report = buildReport(stages);
            core.setOutput("report", JSON.stringify(report));
            core.info(JSON.stringify({
              event: "pr-automation.review-report",
              status: report.status,
              failed: report.stages
                .filter((stage) => stage.status === "failed")
                .map((stage) => stage.id),
              stage_retries: report.metrics.stage_retries,
            }));
