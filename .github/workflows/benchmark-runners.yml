name: Build runner benchmark

run-name: Windows build ${{ inputs.mode || 'benchmark and trace' }} (${{ github.ref_name }})

on:
  # Push discovers this workflow on a feature branch before it exists on master.
  push:
    branches:
      - copilot/runner-build-benchmarks
    paths:
      - .github/workflows/benchmark-runners.yml
      - .github/benchmark-windows.cmake
      - .github/benchmark-tracing/**
  workflow_dispatch:
    inputs:
      mode:
        description: Uninstrumented averages, diagnostic traces, or both
        type: choice
        default: benchmark
        options: [benchmark, trace, all]

permissions:
  contents: read

concurrency:
  group: build-runner-benchmark-${{ github.ref }}-${{ inputs.mode || 'all' }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 4
  CARGO_NET_RETRY: 10
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: lld-link
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static -C linker-flavor=lld-link
  CC_x86_64_pc_windows_msvc: clang-cl
  CXX_x86_64_pc_windows_msvc: clang-cl
  AR_x86_64_pc_windows_msvc: llvm-lib
  CMAKE_GENERATOR: Ninja
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  LLVM_VERSION: 20.1.8
  XWIN_VERSION: 17
  XWIN_ARCH: x86_64
  XWIN_CROSS_COMPILER: clang-cl

jobs:
  build:
    name: Windows build on ${{ matrix.host }} (4 vCPU, ${{ matrix.sample == 0 && 'trace' || format('sample {0}', matrix.sample) }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        host: [windows, linux]
        sample: ${{ fromJSON(inputs.mode == 'trace' && '[0]' || inputs.mode == 'benchmark' && '[1,2,3,4]' || '[0,1,2,3,4]') }}
        include:
          - host: windows
            runner: windows-2022
          - host: linux
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up MSVC and Windows SDK
        if: runner.os == 'Windows'
        run: |
          $ErrorActionPreference = 'Stop'
          $before = @{}
          Get-ChildItem Env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $installation = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) { throw 'Visual Studio C++ tools not found' }
          Import-Module "$installation\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          Get-ChildItem Env: | Where-Object { $before[$_.Name] -ne $_.Value } |
            ForEach-Object { "$($_.Name)=$($_.Value)" >> $env:GITHUB_ENV }

      - name: Install LLVM on Windows
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $asset = "LLVM-$env:LLVM_VERSION-win64.exe"
          $release = gh api "repos/llvm/llvm-project/releases/tags/llvmorg-$env:LLVM_VERSION" | ConvertFrom-Json
          $digest = ($release.assets | Where-Object name -EQ $asset).digest
          if ($digest -notmatch '^sha256:[0-9a-f]{64}$') { throw 'LLVM asset SHA256 is unavailable' }
          gh release download "llvmorg-$env:LLVM_VERSION" --repo llvm/llvm-project --pattern $asset --dir $env:RUNNER_TEMP
          $installer = Join-Path $env:RUNNER_TEMP $asset
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $digest.Substring(7)) {
            throw 'LLVM installer checksum mismatch'
          }
          $process = Start-Process $installer -ArgumentList '/S', "/D=$env:RUNNER_TEMP\llvm" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "LLVM installer failed with exit $($process.ExitCode)" }
          "$env:RUNNER_TEMP\llvm\bin" >> $env:GITHUB_PATH

      - name: Install Windows build tools
        if: runner.os == 'Windows'
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nasm ninja --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'build tool installation failed' }
          "$env:ProgramFiles\NASM" >> $env:GITHUB_PATH
          "CMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE\.github\benchmark-windows.cmake" >> $env:GITHUB_ENV

      - name: Install LLVM and build tools on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --silent --show-error https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo 'deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-20 main' |
            sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -qq
          sudo apt-get install -y clang-20 lld-20 llvm-20 nasm ninja-build
          echo /usr/lib/llvm-20/bin >> "$GITHUB_PATH"

      - name: Install cargo-xwin
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset=cargo-xwin-v0.23.1.x86_64-unknown-linux-musl.tar.gz
          mkdir -p "$RUNNER_TEMP/cargo-xwin"
          gh release download v0.23.1 --repo rust-cross/cargo-xwin \
            --pattern "$asset" --pattern "$asset.sha256" --dir "$RUNNER_TEMP/cargo-xwin"
          cd "$RUNNER_TEMP/cargo-xwin"
          sha256sum --check "$asset.sha256"
          tar -xzf "$asset"
          echo "$RUNNER_TEMP/cargo-xwin" >> "$GITHUB_PATH"

      - name: Prepare dependencies outside the benchmark
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'benchmark-target'
          $env:XWIN_CACHE_DIR = Join-Path $env:RUNNER_TEMP 'xwin'
          "CARGO_TARGET_DIR=$env:CARGO_TARGET_DIR" >> $env:GITHUB_ENV
          "XWIN_CACHE_DIR=$env:XWIN_CACHE_DIR" >> $env:GITHUB_ENV
          rustup show active-toolchain
          rustup target add x86_64-pc-windows-msvc
          # Cross-builds also compile build scripts and proc macros for the host.
          cargo fetch --locked
          if ($env:RUNNER_OS -eq 'Linux') {
            cargo xwin cache xwin
          }

      - name: Install Linux trace tools
        if: ${{ matrix.sample == 0 && runner.os == 'Linux' }}
        shell: bash
        run: |
          sudo apt-get install -y linux-tools-common linux-tools-generic
          perf_binary=$(find -L /usr/lib/linux-tools -type f -name perf | sort -V | tail -n 1)
          if ! test -x "$perf_binary"; then
            echo "::error::Installed Linux tools do not provide an executable perf"
            exit 1
          fi
          echo "PERF_BINARY=$perf_binary" >> "$GITHUB_ENV"

      - name: Measure clean Windows release build
        env:
          BENCHMARK_HOST: ${{ matrix.host }}
          BENCHMARK_RUNNER: ${{ matrix.runner }}
          BENCHMARK_SAMPLE: ${{ matrix.sample }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Path benchmark-results | Out-Null
          $vcpus = [Environment]::ProcessorCount
          if ($vcpus -ne 4) { throw "expected 4 vCPUs, found $vcpus" }
          if (Test-Path $env:CARGO_TARGET_DIR) { throw 'benchmark target directory is not clean' }

          $compiler = (& clang-cl --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $compiler -notmatch "clang version $([regex]::Escape($env:LLVM_VERSION))") {
            throw 'unexpected clang-cl version'
          }
          $linker = (& lld-link --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $linker -notmatch [regex]::Escape($env:LLVM_VERSION)) {
            throw 'unexpected lld-link version'
          }
          $rust = (& rustc --version --verbose | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'rustc version check failed' }
          $cpu = if ($env:RUNNER_OS -eq 'Windows') {
            (Get-CimInstance Win32_Processor).Name -join ', '
          } else {
            (Get-Content /proc/cpuinfo | Select-String '^model name' | Select-Object -First 1).Line
          }
          $arguments = @('build', '--frozen', '--release', '--package', 'ironrdp-agent',
            '--bin', 'ironrdp-agent', '--target', 'x86_64-pc-windows-msvc', '--timings')
          if ($env:RUNNER_OS -eq 'Linux') { $arguments = @('xwin') + $arguments }

          $instrumented = $env:BENCHMARK_SAMPLE -eq '0'
          if ($instrumented) {
            & ./.github/benchmark-tracing/Invoke-BuildTrace.ps1 -CargoArguments $arguments -OutputDirectory benchmark-results
            $interval = Get-Content benchmark-results/build-interval.json -Raw | ConvertFrom-Json
            $exitCode = $interval.exitCode
            $seconds = $interval.coreBuildSeconds
          } else {
            $timer = [Diagnostics.Stopwatch]::StartNew()
            & cargo @arguments 2>&1 | Tee-Object -FilePath benchmark-results/build.log
            $exitCode = $LASTEXITCODE
            $timer.Stop()
            $seconds = [math]::Round($timer.Elapsed.TotalSeconds, 3)
          }

          $timing = [ordered]@{
            host = $env:BENCHMARK_HOST
            sample = [int]$env:BENCHMARK_SAMPLE
            instrumented = $instrumented
            runner = $env:BENCHMARK_RUNNER
            vcpus = $vcpus
            cpu = $cpu
            imageVersion = $env:ImageVersion
            commit = $env:GITHUB_SHA
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            target = 'x86_64-pc-windows-msvc'
            profile = 'release'
            command = 'cargo ' + ($arguments -join ' ')
            compiler = $compiler
            compilerPath = (Get-Command clang-cl).Source
            linker = $linker
            linkerPath = (Get-Command lld-link).Source
            rust = $rust
            coreBuildSeconds = $seconds
            exitCode = $exitCode
            succeeded = ($exitCode -eq 0)
          }
          $timing | ConvertTo-Json | Set-Content benchmark-results/build-time.json
          "## $env:BENCHMARK_HOST sample $env:BENCHMARK_SAMPLE core build: $($timing.coreBuildSeconds) s (exit $exitCode)" >> $env:GITHUB_STEP_SUMMARY
          if ($exitCode -ne 0) { exit $exitCode }

          $binary = Join-Path $env:CARGO_TARGET_DIR 'x86_64-pc-windows-msvc/release/ironrdp-agent.exe'
          & llvm-readobj --file-headers $binary | Tee-Object -FilePath benchmark-results/pe-headers.txt
          if ($LASTEXITCODE -ne 0) { throw 'PE header inspection failed' }
          if ((Get-Content benchmark-results/pe-headers.txt -Raw) -notmatch 'IMAGE_FILE_MACHINE_AMD64') {
            throw 'build did not produce a Windows x64 executable'
          }
          Copy-Item $binary benchmark-results/ironrdp-agent.exe
          Copy-Item (Join-Path $env:CARGO_TARGET_DIR 'cargo-timings/*.html') benchmark-results

      - name: Save timing, logs, Cargo timings, and executable
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.sample == 0 && format('build-trace-{0}', matrix.host) || format('build-benchmark-{0}-{1}', matrix.host, matrix.sample) }}
          path: benchmark-results/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  compare:
    name: Verify Windows executables and compare average build times
    needs: build
    if: ${{ !cancelled() && inputs.mode != 'trace' }}
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: build-benchmark-*
          path: benchmark-results

      - name: Verify executables and summarize timings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $timings = @(
            foreach ($hostName in @('windows', 'linux')) {
              foreach ($sample in 1..4) {
                $directory = Join-Path benchmark-results "build-benchmark-$hostName-$sample"
                $timing = Get-Content (Join-Path $directory 'build-time.json') -Raw | ConvertFrom-Json
                if (-not $timing.succeeded) { throw "$hostName sample $sample build failed; see its artifact" }
                if ($timing.host -ne $hostName -or $timing.sample -ne $sample -or
                    $timing.instrumented -or
                    $timing.commit -ne $env:GITHUB_SHA -or $timing.runId -ne $env:GITHUB_RUN_ID -or
                    $timing.vcpus -ne 4 -or $timing.coreBuildSeconds -le 0) {
                  throw "invalid benchmark metadata for $hostName sample $sample"
                }
                $binary = Join-Path $directory 'ironrdp-agent.exe'
                & $binary --version | Tee-Object -FilePath (Join-Path $directory 'version.txt') | Write-Host
                & $binary --help | Set-Content (Join-Path $directory 'smoke-test.txt')
                $timing
              }
            }
          )
          $first = $timings[0]
          if (@($timings | Where-Object { $_.target -ne $first.target -or $_.profile -ne $first.profile }).Count -ne 0) {
            throw 'benchmark targets or profiles differ'
          }
          $averages = @(
            foreach ($hostName in @('windows', 'linux')) {
              $samples = @($timings | Where-Object host -EQ $hostName)
              if ($samples.Count -ne 4) { throw "expected 4 samples for $hostName" }
              $stats = $samples | Measure-Object -Property coreBuildSeconds -Average -Minimum -Maximum
              [pscustomobject]@{
                host = $hostName
                runner = $samples[0].runner
                vcpus = $samples[0].vcpus
                samples = $samples.Count
                averageCoreBuildSeconds = [math]::Round($stats.Average, 3)
                minCoreBuildSeconds = $stats.Minimum
                maxCoreBuildSeconds = $stats.Maximum
              }
            }
          )
          $fastest = ($averages | Measure-Object -Property averageCoreBuildSeconds -Minimum).Minimum
          $averages = @($averages | Select-Object *, @{
            Name = 'relativeToFastestAverage'
            Expression = { [math]::Round($_.averageCoreBuildSeconds / $fastest, 3) }
          })
          New-Item -ItemType Directory comparison | Out-Null
          $timings | Select-Object host, sample, runner, vcpus, cpu, coreBuildSeconds |
            Export-Csv comparison/build-times.csv -NoTypeInformation
          $timings | ConvertTo-Json -Depth 5 | Set-Content comparison/build-times.json
          $averages | Export-Csv comparison/averages.csv -NoTypeInformation
          $averages | ConvertTo-Json | Set-Content comparison/averages.json
          $summary = @(
            '## Windows x64 release build averages',
            '',
            '| Build host | Runner | vCPU | Samples | Average core build (s) | Min (s) | Max (s) | Relative to fastest average |',
            '| --- | --- | ---: | ---: | ---: | ---: | ---: | ---: |'
          )
          foreach ($average in $averages) {
            $summary += "| $($average.host) | $($average.runner) | $($average.vcpus) | $($average.samples) | $($average.averageCoreBuildSeconds) | $($average.minCoreBuildSeconds) | $($average.maxCoreBuildSeconds) | $($average.relativeToFastestAverage)x |"
          }
          $summary += @(
            '',
            '## Individual samples',
            '',
            '| Build host | Sample | Core build (s) |',
            '| --- | ---: | ---: |'
          )
          foreach ($timing in $timings) {
            $summary += "| $($timing.host) | $($timing.sample) | $($timing.coreBuildSeconds) |"
          }
          $summary += @(
            '',
            'All eight Windows executables passed --version and --help smoke tests.',
            'The stopwatch surrounds only the offline cargo build command, including clean dependency compilation and linking.',
            'Setup, downloads, metadata checks, artifact uploads, and smoke tests are outside the timed interval.',
            'Each of the four samples per host uses a fresh 4-vCPU runner with no build cache or incremental compilation; CPU models and tool versions are recorded in JSON.',
            'Windows uses the installed MSVC/SDK; Linux uses the cargo-xwin MSVC/SDK, so this is a runner/toolchain comparison, not an OS-only experiment.',
            '',
            "Commit: $env:GITHUB_SHA"
          )
          $summary | Set-Content comparison/summary.md
          $summary >> $env:GITHUB_STEP_SUMMARY
          $averages | Format-Table | Out-String | Write-Host
          foreach ($timing in $timings) {
            $id = "$($timing.host)-$($timing.sample)"
            Copy-Item "benchmark-results/build-benchmark-$id/smoke-test.txt" "comparison/smoke-test-$id.txt"
            Copy-Item "benchmark-results/build-benchmark-$id/version.txt" "comparison/version-$id.txt"
          }

      - name: Save comparison
        uses: actions/upload-artifact@v7
        with:
          name: build-benchmark-comparison
          path: comparison/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  verify-traces:
    name: Verify diagnostic builds
    needs: build
    if: ${{ !cancelled() && inputs.mode != 'benchmark' }}
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: build-trace-*
          path: traces

      - name: Verify trace metadata and Windows executables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($hostName in @('windows', 'linux')) {
            $directory = Join-Path traces "build-trace-$hostName"
            $timing = Get-Content (Join-Path $directory 'build-time.json') -Raw | ConvertFrom-Json
            $interval = Get-Content (Join-Path $directory 'build-interval.json') -Raw | ConvertFrom-Json
            if (-not $timing.succeeded -or -not $timing.instrumented -or $timing.sample -ne 0 -or
                $timing.commit -ne $env:GITHUB_SHA -or $timing.vcpus -ne 4 -or
                $interval.coreBuildSeconds -ne $timing.coreBuildSeconds) {
              throw "invalid diagnostic metadata for $hostName"
            }
            $binary = Join-Path $directory 'ironrdp-agent.exe'
            & $binary --version | Write-Host
            & $binary --help | Out-Null
            "## $hostName diagnostic build: $($timing.coreBuildSeconds) s (instrumented, excluded from averages)" >> $env:GITHUB_STEP_SUMMARY
          }
          if ((Get-Item traces/build-trace-windows/build.etl).Length -eq 0) { throw 'empty ETL capture' }
          $records = Get-Content traces/build-trace-linux/perf-records.json -Raw | ConvertFrom-Json
          if ($records.Count -ne 2 -or @($records | Where-Object samples -LE 0).Count -ne 0) {
            throw 'empty perf captures'
          }
          if ($records[0].processNames -notcontains 'rustc') { throw 'CPU capture does not include rustc' }
