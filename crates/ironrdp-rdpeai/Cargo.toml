[package]
name = "ironrdp-rdpeai"
version = "0.1.0"
readme = "README.md"
description = "AUDIO_INPUT dynamic channel for audio capture as described in MS-RDPEAI"
edition.workspace = true
rust-version = "1.94"
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

publish = false

[lib]
doctest = false
test = false

[dependencies]
ironrdp-core = { path = "../ironrdp-core", version = "0.3", features = ["alloc"] }
ironrdp-dvc = { path = "../ironrdp-dvc", version = "0.9" } # public
ironrdp-pdu = { path = "../ironrdp-pdu", version = "0.10", features = ["alloc"] } # public
ironrdp-rdpsnd = { path = "../ironrdp-rdpsnd", version = "0.10" } # public — shared AUDIO_FORMAT
ironrdp-svc = { path = "../ironrdp-svc", version = "0.8" } # public
tracing = { version = "0.1", features = ["log"] }

[lints]
workspace = true
