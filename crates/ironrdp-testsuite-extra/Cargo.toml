[package]
name = "ironrdp-testsuite-extra"
version = "0.1.0"
edition.workspace = true
description = "IronRDP extra test suite"
publish = false
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
autotests = false

[features]
default = ["full", "rustls"]
full = ["dep:ironrdp-agent", "dep:ironrdp-daemon", "dep:ironrdp-viewer"]
rustls = ["ironrdp-mstsgu/rustls", "ironrdp-tls/rustls"]
native-tls = ["ironrdp-mstsgu/native-tls", "ironrdp-tls/native-tls"]

[dependencies]
ironrdp-agent = { path = "../ironrdp-agent", optional = true }
ironrdp-daemon = { path = "../ironrdp-daemon", optional = true }
ironrdp-viewer = { path = "../ironrdp-viewer", optional = true }

[lib]
doctest = false
test = false

[[test]]
name = "integration_tests_extra"
path = "tests/main.rs"
harness = true

[dev-dependencies]
aes-gcm = "0.10"
anyhow = "1.0"
async-trait = "0.1"
hmac = "0.12"
ironrdp = { path = "../ironrdp", features = ["server", "pdu", "connector", "session", "svc", "dvc", "echo"] }
ironrdp-async.path = "../ironrdp-async"
ironrdp-bulk.path = "../ironrdp-bulk"
ironrdp-capture-replay.path = "../ironrdp-capture-replay"
ironrdp-client.path = "../ironrdp-client"
ironrdp-core.path = "../ironrdp-core"
ironrdp-dvc.path = "../ironrdp-dvc"
ironrdp-dvc-pipe-proxy.path = "../ironrdp-dvc-pipe-proxy"
ironrdp-svc.path = "../ironrdp-svc"
ironrdp-input.path = "../ironrdp-input"
ironrdp-propertyset.path = "../ironrdp-propertyset"
ironrdp-rdpdr.path = "../ironrdp-rdpdr"
ironrdp-rdpemt = { path = "../ironrdp-rdpemt", features = ["std"] }
ironrdp-rdpeudp = { path = "../ironrdp-rdpeudp", features = ["std"] }
ironrdp-rdpeudp-tokio.path = "../ironrdp-rdpeudp-tokio"
ironrdp-rdpsnd.path = "../ironrdp-rdpsnd"
ironrdp-rdpsnd-native = { path = "../ironrdp-rdpsnd-native", features = ["capture"] }
ironrdp-rpc = { path = "../ironrdp-rpc", features = ["__test"] }
ironrdp-tokio.path = "../ironrdp-tokio"
ironrdp-tls.path = "../ironrdp-tls"
ironrdp-vmconnect.path = "../ironrdp-vmconnect"
rcgen = "0.14"
semver = "1.0"
sha2 = "0.10"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["sync", "time", "net", "rt", "rt-multi-thread", "macros", "io-util"] }
tokio-native-tls = "0.3"
# No provider feature here on purpose: `ironrdp-tls` already brings
# aws-lc-rs, and enabling a second one leaves rustls unable to pick a
# process default, which fails every TLS test in this binary.
tokio-rustls = { version = "0.26", default-features = false }
uuid = { version = "1", features = ["v4"] }
ironrdp-mstsgu = { path = "../ironrdp-mstsgu" }

[target.'cfg(windows)'.dev-dependencies]
ironrdp-rdpdr-native.path = "../ironrdp-rdpdr-native"

[lints]
workspace = true
