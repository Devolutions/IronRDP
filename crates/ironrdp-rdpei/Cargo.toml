[package]
name = "ironrdp-rdpei"
version = "0.1.0"
readme = "README.md"
description = "Input virtual channel extension (MS-RDPEI) implementation"
edition.workspace = true
rust-version = "1.94"
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
doctest = false

[dependencies]
bitflags = "2.11"
ironrdp-core = { path = "../ironrdp-core", version = "0.3" } # public
ironrdp-dvc = { path = "../ironrdp-dvc", version = "0.9" } # public
ironrdp-pdu = { path = "../ironrdp-pdu", version = "0.10" } # public
ironrdp-svc = { path = "../ironrdp-svc", version = "0.8" } # public
tracing = { version = "0.1", features = ["log"] }

[lints]
workspace = true
