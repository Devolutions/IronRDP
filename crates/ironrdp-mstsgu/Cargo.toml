[package]
name = "ironrdp-mstsgu"
version = "0.0.2"
readme = "README.md"
description = "Terminal Services Gateway Server Protocol"
edition.workspace = true
rust-version = "1.94"
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
doctest = false
test = false

[[test]]
name = "http_auth"
path = "tests/http_auth.rs"
required-features = ["native-tls"]

[[test]]
name = "udp"
path = "tests/udp.rs"

[[test]]
name = "http_control"
path = "tests/http_control.rs"

[[test]]
name = "rpc_pdu"
path = "tests/rpc_pdu.rs"

[[test]]
name = "rpch_v2"
path = "tests/rpch_v2.rs"

[[test]]
name = "rpc_tsgu_stubs"
path = "tests/rpc_tsgu_stubs.rs"

[[test]]
name = "rpch_http"
path = "tests/rpch_http.rs"

[[test]]
name = "tunnel_policy"
path = "tests/tunnel_policy.rs"

[[test]]
name = "packet_io"
path = "tests/packet_io.rs"
required-features = ["native-tls", "test-support"]

[[test]]
name = "packet_io_rustls"
path = "tests/packet_io_rustls.rs"
required-features = ["rustls", "test-support"]

[[test]]
name = "proxy"
path = "tests/proxy.rs"
required-features = ["native-tls", "test-support"]

[[test]]
name = "consent"
path = "tests/consent.rs"
required-features = ["native-tls", "test-support"]

[features]
default = []
rustls = ["ironrdp-tls/rustls", "tokio-tungstenite/rustls-tls-native-roots"]
native-tls = ["ironrdp-tls/native-tls", "tokio-tungstenite/native-tls"]
test-support = ["tokio/io-util"]
smartcard = [
    "sspi/scard",
    "sspi/dns_resolver",
    "dep:picky",
    "dep:picky-asn1-der",
    "dep:picky-asn1-x509",
]

[dependencies]
base64 = "0.22"
bitflags = "2.11"
futures-util = "0.3"
http-body-util = { version = "0.1.4", features = ["channel"] }
hyper-util = { version = "0.1", features = ["tokio"] }
hyper = { version = "1.9", features = ["client", "http1"] }
ironrdp-core = { path = "../ironrdp-core", version = "0.3", features = ["std"] } # public
ironrdp-error = { path = "../ironrdp-error", version = "0.2" }
ironrdp-tls = { path = "../ironrdp-tls", version = "0.2.3" } # public
log = "0.4"
sspi = { version = "0.21", features = ["network_client"] }
tokio-tungstenite = { version = "0.29" }
tokio-util = { version = "0.7" }
tokio = { version = "1.52", features = ["macros", "rt", "io-util"] }
tokio-socks = "0.5.3"
uuid = { version = "1", features = ["v4"] }
picky = { version = "=7.0.0-rc.25", optional = true }
picky-asn1-der = { version = "0.5", optional = true }
picky-asn1-x509 = { version = "0.15", optional = true }

[dev-dependencies]
hyper = { version = "1.9", features = ["server", "http1"] }
tokio = { version = "1.52", features = ["io-util", "macros", "net", "rt", "sync"] }
tokio-native-tls = "0.3"

[lints]
workspace = true
