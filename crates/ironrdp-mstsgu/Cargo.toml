[package]
name = "ironrdp-mstsgu"
version = "0.0.1"
readme = "README.md"
description = "Terminal Services Gateway Server Protocol"
edition.workspace = true
rust-version = "1.94"
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
doctest = false
test = false

[[test]]
name = "http_auth"
path = "tests/http_auth.rs"
required-features = ["native-tls"]

[[test]]
name = "udp"
path = "tests/udp.rs"

[[test]]
name = "http_control"
path = "tests/http_control.rs"

[[test]]
name = "rpc_pdu"
path = "tests/rpc_pdu.rs"

[[test]]
name = "rpch_http"
path = "tests/rpch_http.rs"

[features]
default = []
rustls = ["ironrdp-tls/rustls", "tokio-tungstenite/rustls-tls-native-roots"]
native-tls = ["ironrdp-tls/native-tls", "tokio-tungstenite/native-tls"]

[dependencies]
base64 = "0.22"
bitflags = "2.11"
futures-util = "0.3"
http-body-util = { version = "0.1" }
hyper-util = { version = "0.1", features = ["tokio"] }
hyper = { version = "1.9", features = ["client", "http1"] }
ironrdp-core = { path = "../ironrdp-core", version = "0.2", features = ["std"] } # public
ironrdp-error = { path = "../ironrdp-error", version = "0.2" }
ironrdp-tls = { path = "../ironrdp-tls", version = "0.2" }
log = "0.4"
sspi = { version = "0.21", features = ["network_client"] }
tokio-tungstenite = { version = "0.29" }
tokio-util = { version = "0.7" }
tokio = { version = "1.52", features = ["macros", "rt", "io-util"] }
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
