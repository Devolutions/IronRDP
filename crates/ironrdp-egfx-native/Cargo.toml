[package]
name = "ironrdp-egfx-native"
version = "0.0.0"
publish = false
readme = "README.md"
description = "Native H.264 decoders for the IronRDP graphics and video channels"
edition.workspace = true
rust-version = "1.94"
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
doctest = false

[target.'cfg(windows)'.dependencies]
ironrdp-egfx = { path = "../ironrdp-egfx", version = "0.4" } # public
tracing = { version = "0.1", features = ["log"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }

[lints]
workspace = true
