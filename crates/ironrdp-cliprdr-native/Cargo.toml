[package]
name = "ironrdp-cliprdr-native"
version = "0.7.0"
readme = "README.md"
description = "Native CLIPRDR static channel backend implementations for IronRDP"
edition.workspace = true
rust-version = "1.94"
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Internal (PRIVATE!) feature used to expose internals to the shared integration tests.
# Don't rely on this whatsoever. It may disappear at any time.
__test = ["dep:visibility"]

[lib]
doctest = false
test = false

[dependencies]
ironrdp-cliprdr = { path = "../ironrdp-cliprdr", version = "0.7" } # public
ironrdp-core = { path = "../ironrdp-core", version = "0.2" }
tracing = { version = "0.1", features = ["log"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", features = ["poll"] }
visibility = { version = "0.1", optional = true }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"] }
ironrdp-cliprdr-format = { path = "../ironrdp-cliprdr-format", version = "0.2" }
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
