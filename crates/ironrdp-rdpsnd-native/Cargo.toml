[package]
name = "ironrdp-rdpsnd-native"
version = "0.7.0"
description = "Native RDPSND playback and optional MS-RDPEAI capture backends for IronRDP"
edition.workspace = true
rust-version = "1.94"
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
doctest = false
test = false

[features]
default = ["opus", "aac"]
opus = ["dep:opus2"]
# AAC playback through the Windows Media Foundation decoder; no effect on other platforms.
aac = []
# MS-RDPEAI microphone capture backend (CPAL input + ironrdp-rdpeai handler).
capture = ["dep:ironrdp-rdpeai"]

[dependencies]
cpal = "0.17"
ironrdp-core = { path = "../ironrdp-core", version = "0.3", features = ["alloc"] }
ironrdp-error = { path = "../ironrdp-error", version = "0.2", features = ["std"] } # public
ironrdp-rdpeai = { path = "../ironrdp-rdpeai", version = "0.1", optional = true } # public
ironrdp-rdpsnd = { path = "../ironrdp-rdpsnd", version = "0.10" } # public
opus2 = { version = "0.4", optional = true, features = ["bundled"] }
ringbuf = "0.5"
tracing = { version = "0.1", features = ["log"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }

[dev-dependencies]
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
