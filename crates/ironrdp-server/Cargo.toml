[package]
name = "ironrdp-server"
version = "0.14.0"
readme = "README.md"
description = "Extendable skeleton for implementing custom RDP servers"
edition.workspace = true
rust-version = "1.94"
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
doctest = true
test = false

[features]
default = ["rayon", "qoi", "qoiz", "aws-lc-rs"]
# The crypto provider this crate asks tokio-rustls for. `aws-lc-rs` is the default, as it is
# tokio-rustls' own; a consumer that runs its TLS on ring disables default features and
# enables `ring` instead, so this crate does not pull aws-lc-rs in. rustls chooses a provider by
# itself only when exactly one of its providers is compiled in. When both are — both of these
# features enabled, or one of them plus another dependency enabling tokio-rustls' or rustls'
# other provider, since features are additive across the dependency graph — or when neither is,
# the consumer installs the provider it wants with `CryptoProvider::install_default` before
# building a `ServerConfig`, whichever provider that is. `TlsIdentityCtx::make_acceptor` returns
# an error rather than letting rustls panic when no default is installed and this crate's own
# features leave rustls no single provider to choose.
aws-lc-rs = ["tokio-rustls/aws_lc_rs"]
ring = ["tokio-rustls/ring"]
helper = ["dep:x509-cert", "dep:rustls-pemfile"]
rayon = ["dep:rayon"]
qoi = ["dep:qoicoubeh", "ironrdp-pdu/qoi"]
qoiz = ["dep:zstd-safe", "qoi", "ironrdp-pdu/qoiz"]
egfx = ["dep:ironrdp-egfx"]
usb = ["dep:ironrdp-rdpeusb", "dep:ironrdp-usb"]
# Opt-in NSCodec encoder. Off by default so consumers that don't need a legacy
# bitmap codec fallback (e.g., RemoteFX-only or H.264-capable clients) don't
# pay the extra build cost.
nscodec = ["dep:ironrdp-nscodec"]

# Internal (PRIVATE!) features used to aid testing.
# Don't rely on these whatsoever. They may disappear at any time.
__bench = ["dep:visibility"]
__test = ["dep:visibility"]

[dependencies]
rand = "0.9"
tokio = { version = "1", features = ["net", "macros", "sync", "rt", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] } # public
async-trait = "0.1"
ironrdp-async = { path = "../ironrdp-async", version = "0.12" }
ironrdp-ainput = { path = "../ironrdp-ainput", version = "0.10" }
ironrdp-connector = { path = "../ironrdp-connector", version = "0.12" } # public
ironrdp-core = { path = "../ironrdp-core", version = "0.3" }
ironrdp-egfx = { path = "../ironrdp-egfx", version = "0.5", optional = true }
ironrdp-error = { path = "../ironrdp-error", version = "0.2", features = ["std"] } # public
ironrdp-nscodec = { path = "../ironrdp-nscodec", version = "0.4", optional = true, features = ["encoder"] }
ironrdp-pdu = { path = "../ironrdp-pdu", version = "0.11" } # public
ironrdp-svc = { path = "../ironrdp-svc", version = "0.10" } # public
ironrdp-cliprdr = { path = "../ironrdp-cliprdr", version = "0.9" } # public
ironrdp-displaycontrol = { path = "../ironrdp-displaycontrol", version = "0.10" } # public
ironrdp-echo = { path = "../ironrdp-echo", version = "0.6" } # public
ironrdp-dvc = { path = "../ironrdp-dvc", version = "0.10" } # public
ironrdp-tokio = { path = "../ironrdp-tokio", version = "0.12", features = ["reqwest"] }
ironrdp-acceptor = { path = "../ironrdp-acceptor", version = "0.12" } # public
ironrdp-graphics = { path = "../ironrdp-graphics", version = "0.11" } # public
ironrdp-rdpdr = { path = "../ironrdp-rdpdr", version = "0.9" } # public
ironrdp-rdpsnd = { path = "../ironrdp-rdpsnd", version = "0.11" } # public
ironrdp-rdpei = { path = "../ironrdp-rdpei", version = "0.3" } # public
ironrdp-rdpeai = { path = "../ironrdp-rdpeai", version = "0.2" } # public
ironrdp-rdpeusb = { path = "../ironrdp-rdpeusb", version = "0.2", optional = true }
ironrdp-usb = { path = "../ironrdp-usb", version = "0.1", optional = true }
ironrdp-rdpemt = { path = "../ironrdp-rdpemt", version = "0.1" } # public
ironrdp-rdpeudp = { path = "../ironrdp-rdpeudp", version = "0.1" } # public
ironrdp-rdpeudp-tokio = { path = "../ironrdp-rdpeudp-tokio", version = "0.2" } # public
tracing = { version = "0.1", features = ["log"] }
x509-cert = { version = "0.3", optional = true }
rustls-pemfile = { version = "2.2", optional = true }
rayon = { version = "1.12", optional = true }
bytes = "1"
visibility = { version = "0.1", optional = true }
qoicoubeh = { version = "0.5", optional = true }
zstd-safe = { version = "7.2", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["sync"] }

[lints]
workspace = true
