[package]
name = "ironrdp-rdpear"
version = "0.1.0"
readme = "README.md"
description = "Authentication redirection dynamic channel framing and codecs as described in MS-RDPEAR"
rust-version = "1.94"
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
doctest = false
test = false

[features]
default = ["std"]
std = ["ironrdp-core/std", "ironrdp-pdu/std"]

[dependencies]
ironrdp-core = { version = "0.3.1", path = "../ironrdp-core", default-features = false, features = ["alloc"] } # public
ironrdp-dvc = { version = "0.10.0", path = "../ironrdp-dvc", default-features = false } # public
ironrdp-pdu = { version = "0.11.0", path = "../ironrdp-pdu", default-features = false, features = ["alloc"] } # public

[dev-dependencies]
ironrdp-svc = { path = "../ironrdp-svc" }

[lints]
workspace = true
