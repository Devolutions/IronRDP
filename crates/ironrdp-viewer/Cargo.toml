[package]
name = "ironrdp-viewer"
version = "0.1.0"
readme = "README.md"
description = "Portable RDP viewer (GUI binary) without GPU acceleration"
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
default-run = "ironrdp-viewer"

[lib]
doctest = false
test = false

[[bin]]
name = "ironrdp-viewer"
test = false

[features]
default = ["rustls"]
rustls = ["ironrdp/rustls"]
native-tls = ["ironrdp/native-tls"]
qoi = ["ironrdp/qoi"]
qoiz = ["ironrdp/qoiz"]
# Decode H.264 graphics and MS-RDPEVOR video with the bundled OpenH264 sources.
openh264 = ["ironrdp/client-openh264"]

[dependencies]
ironrdp-daemon = { path = "../ironrdp-daemon", version = "0.1" } # public
ironrdp-rpc = { path = "../ironrdp-rpc", version = "0.2" }
ironrdp = { path = "../ironrdp", version = "0.17", features = ["connector", "cliprdr", "input", "pdu", "rdpei", "client", "client-all", "client-vmconnect", "session"] } # public
ironrdp-cfg = { path = "../ironrdp-cfg", version = "0.3" }
ironrdp-propertyset = { path = "../ironrdp-propertyset", version = "0.1" }
ironrdp-rdpfile = { path = "../ironrdp-rdpfile", version = "0.1" }
ironrdp-rail = { path = "../ironrdp-rail", version = "0.3" }

# Windowing and rendering
winit = { version = "0.30", features = ["rwh_06"] }
softbuffer = "0.4"

# CLI
clap = { version = "4.6", features = ["derive", "cargo", "env"] }
inquire = "0.9"
proc-exit = "2"

# Logging
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async, futures
tokio = { version = "1", features = ["full"] }

# Utils
whoami = "2.1"
anyhow = "1"
smallvec = "1.15"
tap = "1"
semver = "1"
raw-window-handle = "0.6"
url = "2"

[target.'cfg(windows)'.dependencies]
ironrdp-cliprdr-native = { path = "../ironrdp-cliprdr-native", version = "0.9" }
ironrdp-rdpdr-native = { path = "../ironrdp-rdpdr-native", version = "0.9" }
windows = { version = "0.62", features = ["Win32_System_Ole", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
