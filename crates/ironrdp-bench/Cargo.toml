[package]
name = "ironrdp-bench"
version = "0.0.0"
description = "IronRDP benchmarks"
edition.workspace = true
publish = false

[lib]
doctest = false

[[bin]]
name = "corpus-bench"
test = false

[dependencies]
anyhow = "1" # public
ironrdp-capture.path = "../ironrdp-capture"
ironrdp-capture-replay.path = "../ironrdp-capture-replay"
serde = { version = "1", features = ["derive"] } # public
sha2 = "0.10"
toml = "1.1"

[dev-dependencies]
criterion = "0.8"
ironrdp-graphics.path = "../ironrdp-graphics"
ironrdp-pdu.path = "../ironrdp-pdu"
ironrdp-server = { path = "../ironrdp-server", features = ["__bench"] }

[[bench]]
name = "bench"
path = "benches/bench.rs"
harness = false

[lints]
workspace = true
