[package]
name = "ironrdp-bench"
version = "0.0.0"
description = "IronRDP benchmarks"
edition.workspace = true
publish = false

[lib]
doctest = false

[[bin]]
name = "corpus-bench"
test = false

[[bin]]
name = "perfenc"
required-features = ["perfenc"]

[features]
default = ["qoi", "qoiz"]
# Server encoding dependencies for the perfenc binary; the corpus tooling builds without them.
perfenc = ["dep:async-trait", "dep:pico-args", "dep:tokio", "dep:tracing", "dep:tracing-subscriber", "ironrdp/server", "ironrdp/__bench"]
qoi = ["perfenc", "ironrdp/qoi"]
qoiz = ["perfenc", "ironrdp/qoiz"]

[dependencies]
anyhow = "1" # public
async-trait = { version = "0.1", optional = true }
ironrdp = { path = "../ironrdp", features = ["pdu", "connector", "svc"] }
ironrdp-capture.path = "../ironrdp-capture"
ironrdp-capture-replay.path = "../ironrdp-capture-replay" # public
pico-args = { version = "0.5", optional = true }
serde = { version = "1", features = ["derive"] } # public
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "sync", "time"], optional = true }
toml = "1.1"
tracing = { version = "0.1", features = ["log"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
criterion = "0.8"
ironrdp-graphics.path = "../ironrdp-graphics"
ironrdp-pdu.path = "../ironrdp-pdu"
ironrdp-server = { path = "../ironrdp-server", features = ["__bench"] }

[[bench]]
name = "bench"
path = "benches/bench.rs"
harness = false

[[bench]]
name = "corpus"
path = "benches/corpus.rs"
harness = false

[lints]
workspace = true
