[package]
name = "ironrdp-bench"
version = "0.0.0"
description = "IronRDP benchmarks"
edition.workspace = true
publish = false

[lib]
doctest = false

[[bin]]
name = "corpus-bench"
test = false

[[bin]]
name = "perfenc"

[features]
default = ["qoi", "qoiz"]
qoi = ["ironrdp/qoi"]
qoiz = ["ironrdp/qoiz"]

[dependencies]
anyhow = "1" # public
async-trait = "0.1"
ironrdp = { path = "../ironrdp", features = ["server", "pdu", "__bench"] }
ironrdp-capture.path = "../ironrdp-capture"
ironrdp-capture-replay.path = "../ironrdp-capture-replay"
pico-args = "0.5"
serde = { version = "1", features = ["derive"] } # public
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
toml = "1.1"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
criterion = "0.8"
ironrdp-graphics.path = "../ironrdp-graphics"
ironrdp-pdu.path = "../ironrdp-pdu"
ironrdp-server = { path = "../ironrdp-server", features = ["__bench"] }

[[bench]]
name = "bench"
path = "benches/bench.rs"
harness = false

[lints]
workspace = true
