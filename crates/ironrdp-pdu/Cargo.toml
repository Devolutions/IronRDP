[package]
name = "ironrdp-pdu"
version = "0.9.0"
readme = "README.md"
description = "RDP PDU encoding and decoding"
edition.workspace = true
rust-version = "1.90"
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
doctest = false
# test = false

[features]
default = ["legacy-crypto"]
std = ["alloc", "ironrdp-error/std", "ironrdp-core/std"]
alloc = ["ironrdp-core/alloc", "ironrdp-error/alloc"]
# Legacy RDP licensing and auto-reconnect use non-FIPS MD5/SHA-1 based crypto.
# Keep this enabled by default for existing consumers; reduced profiles must opt in explicitly.
legacy-crypto = ["dep:hmac", "dep:md5", "dep:sha1"]
qoi = []
qoiz = ["qoi"]
arbitrary = ["alloc", "dep:arbitrary", "bitflags/arbitrary"]

[dependencies]
bitflags = "2.11"
ironrdp-core = { path = "../ironrdp-core", version = "0.2", features = ["std"] } # public
ironrdp-error = { path = "../ironrdp-error", version = "0.2" } # public
arbitrary = { version = "1", features = ["derive"], optional = true }
tap = "1"

# TODO: get rid of these dependencies (related code should probably go into another crate)
bit_field = "0.10"
byteorder = "1.5" # TODO: remove
der-parser = "10.0"
hmac = { version = "0.12", default-features = false, optional = true }
md5 = { package = "md-5", version = "0.10", optional = true }
num-bigint = "0.4"
num-derive.workspace = true # TODO: remove
num-integer = "0.1"
num-traits.workspace = true # TODO: remove
sha1 = { version = "0.11", optional = true }
x509-cert = { version = "0.3", default-features = false, features = ["std"] }
pkcs1 = { version = "0.7", features = ["std"] }

[dev-dependencies]
expect-test.workspace = true

[lints]
workspace = true
