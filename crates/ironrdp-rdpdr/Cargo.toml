[package]
name = "ironrdp-rdpdr"
version = "0.8.0"
readme = "README.md"
description = "RDPDR channel implementation."
edition.workspace = true
rust-version = "1.94"
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
doctest = false

[dependencies]
ironrdp-core = { path = "../ironrdp-core", version = "0.3" } # public
ironrdp-error = { path = "../ironrdp-error", version = "0.2" } # public
ironrdp-pdu = { path = "../ironrdp-pdu", version = "0.10" } # public
ironrdp-svc = { path = "../ironrdp-svc", version = "0.9" } # public
tracing = { version = "0.1", features = ["log"] }
bitflags = "2.11"
getrandom = { version = "0.3", features = ["std"] }

[lints]
workspace = true
