[package]
name = "ironrdp-rdpegt"
version = "0.0.0"
publish = false
readme = "README.md"
description = "Geometry tracking dynamic channel client as described in MS-RDPEGT"
edition.workspace = true
rust-version = "1.94"
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
doctest = false
test = false

[dependencies]
ironrdp-core = { version = "0.3.0", path = "../ironrdp-core", features = ["alloc"] } # public
ironrdp-dvc = { version = "0.9.0", path = "../ironrdp-dvc" } # public
ironrdp-pdu = { version = "0.10.0", path = "../ironrdp-pdu", features = ["alloc"] } # public
tracing = { version = "0.1", features = ["log"] }

[lints]
workspace = true
