[package]
name = "ironrdp-vmconnect"
version = "0.1.0"
readme = "README.md"
description = "Hyper-V vmconnect (VM console) pre-connection sequence for IronRDP"
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
doctest = false
test = false

[dependencies]
ironrdp-async = { path = "../ironrdp-async", version = "0.10" } # public
ironrdp-connector = { path = "../ironrdp-connector", version = "0.10" } # public
ironrdp-core = { path = "../ironrdp-core", version = "0.2" } # public
ironrdp-pdu = { path = "../ironrdp-pdu", version = "0.9", features = ["std"] } # public
tracing = { version = "0.1", features = ["log"] }

[lints]
workspace = true
