[package]
name = "ironrdp-vmconnect"
version = "0.1.0"
readme = "README.md"
description = "Hyper-V VM console (vmconnect) connection ordering for IronRDP"
edition.workspace = true
rust-version = "1.94"
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
doctest = false

[dependencies]
ironrdp-async = { path = "../ironrdp-async", version = "0.10" } # public
ironrdp-connector = { path = "../ironrdp-connector", version = "0.10" } # public
ironrdp-core = { path = "../ironrdp-core", version = "0.2", features = ["alloc"] } # public
ironrdp-pdu = { path = "../ironrdp-pdu", version = "0.9" } # public
tracing = { version = "0.1", features = ["log"] }

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
ironrdp-dvc = { version = "0.8.0", path = "../ironrdp-dvc" } # public
sha2 = "0.10"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authentication_Identity", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Threading"] }
windows-registry = "0.6"
