[package]
name = "ironrdp-acceptor"
version = "0.10.0"
readme = "README.md"
description = "State machines to drive an RDP connection acceptance sequence"
edition.workspace = true
rust-version = "1.90"
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
doctest = false
test = false

[features]
default = ["rustcrypto", "legacy-crypto"]
legacy-crypto = ["ironrdp-async/legacy-crypto", "ironrdp-connector/legacy-crypto", "ironrdp-pdu/legacy-crypto"]
rustcrypto = ["ironrdp-async/rustcrypto", "ironrdp-connector/rustcrypto"]
fips-aws-lc = ["ironrdp-async/fips-aws-lc", "ironrdp-connector/fips-aws-lc"]

[dependencies]
ironrdp-core = { path = "../ironrdp-core", version = "0.2", features = ["alloc"] } # public
ironrdp-pdu = { path = "../ironrdp-pdu", version = "0.9", default-features = false } # public
ironrdp-svc = { path = "../ironrdp-svc", version = "0.8" } # public
ironrdp-connector = { path = "../ironrdp-connector", version = "0.10", default-features = false } # public
ironrdp-async = { path = "../ironrdp-async", version = "0.10", default-features = false } # public
rand = "0.9"
tracing = { version = "0.1", features = ["log"] }

[lints]
workspace = true
