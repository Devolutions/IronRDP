[package]
name = "ironrdp-agent"
version = "0.1.0"
readme = "README.md"
description = "CLI-driven, daemon-backed agentic RDP client suitable for LLM consumption"
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
doctest = false

[[bin]]
name = "ironrdp-agent"
path = "src/main.rs"
test = false

[dependencies]
# Configuration model and codecs
ironrdp-propertyset = { path = "../ironrdp-propertyset", version = "0.1" }
ironrdp-cfg = { path = "../ironrdp-cfg", version = "0.1" }
ironrdp-rdpfile = { path = "../ironrdp-rdpfile", version = "0.1" }
ironrdp-input = { path = "../ironrdp-input", version = "0.7" }
ironrdp-daemon = { path = "../ironrdp-daemon", version = "0.1" }
ironrdp-rpc = { path = "../ironrdp-rpc", version = "0.1" }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "rt"] }

# CLI
clap = { version = "4.6", features = ["derive", "cargo", "env"] }

# Utils
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ironrdp-tunnel = { path = "../ironrdp-tunnel", version = "0.0" }

[target.'cfg(windows)'.dependencies]
# Windows Sandbox control plane: gRPC/HTTP2 over a per-user named pipe.
bytes = "1"
h2 = "0.4"
http = "1"
md-5 = "0.10"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[lints]
workspace = true
